<script>
  (function () {
    "use strict";

    /*
     * ---------------------------------------------------------------
     * CONFIG
     * ---------------------------------------------------------------
     */

    var ENDPOINT =
      "https://script.google.com/macros/s/AKfycbyxrsl6jS6HVkZcJpxQmZ6FTHvEGQZsqX4nSeosY_h6jZOEowBu5Qw6pE0DPDFtKtyG/exec";

    var STICKY_DAYS = 0;
    var TIMEOUT_MS = 10000;
    var KEY = "verdict_alloc";

    /*
     * ?src=xxx can be appended to the public recruitment link.
     * ?debug=1 shows diagnostic information if allocation fails.
     */

    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(
        window.location.search
      );

      return m
        ? decodeURIComponent(m[1].replace(/\+/g, " "))
        : "";
    }

    var src = param("src");
    var DEBUG = param("debug") === "1";

    /*
     * ---------------------------------------------------------------
     * EXISTING ASSIGNMENT
     * ---------------------------------------------------------------
     */

    var STICKY_MS =
      STICKY_DAYS * 24 * 60 * 60 * 1000;

    var storedForm = "";
    var storedCode = "";

    try {
      var raw = localStorage.getItem(KEY);

      if (raw) {
        var o = JSON.parse(raw);

        if (
          o &&
          o.f &&
          o.c &&
          (
            STICKY_MS === 0 ||
            Date.now() - o.t < STICKY_MS
          )
        ) {
          storedForm = o.f;
          storedCode = o.c;
        }
      }
    } catch (e) {
      /* localStorage is optional */
    }

    /*
     * ---------------------------------------------------------------
     * PARTICIPATION CODE
     * ---------------------------------------------------------------
     */

    var ALPHABET =
      "23456789ABCDEFGHJKMNPQRSTUVWXYZ";

    function makeCode() {
      var s = "";

      for (var i = 0; i < 8; i++) {
        s += ALPHABET.charAt(
          Math.floor(Math.random() * ALPHABET.length)
        );
      }

      return s;
    }

    function persist(form, code) {
      try {
        localStorage.setItem(
          KEY,
          JSON.stringify({
            f: form,
            c: code,
            t: Date.now()
          })
        );
      } catch (e) {
        /* non-fatal */
      }
    }

    /*
     * Generate the code BEFORE contacting Apps Script.
     *
     * This means that if the network request is repeated,
     * Apps Script receives the same code and therefore returns
     * the same allocation rather than consuming another slot.
     */

    if (!storedCode) {
      storedCode = makeCode();
      persist("", storedCode);
    }

    /*
     * ---------------------------------------------------------------
     * ERROR HANDLING
     * ---------------------------------------------------------------
     */

    var finished = false;
    var timeoutId;

    function fail(reason) {
      if (finished) return;

      finished = true;
      clearTimeout(timeoutId);

      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";

      if (DEBUG) {
        var debug = document.getElementById("debug");
        debug.style.display = "block";

        debug.textContent =
          "Diagnostic information\n\n" +
          "Reason: " + reason + "\n" +
          "Endpoint: " + ENDPOINT + "\n" +
          "Source: " + src + "\n" +
          "Stored form: " + storedForm + "\n" +
          "Stored code: " + storedCode;
      }
    }

    /*
     * ---------------------------------------------------------------
     * SUCCESS
     * ---------------------------------------------------------------
     */

    function succeed(res) {
      if (finished) return;

      if (!res || res.error || !res.url) {
        fail(
          "Invalid server response: " +
          JSON.stringify(res)
        );
        return;
      }

      finished = true;
      clearTimeout(timeoutId);

      /*
       * Save the assignment before redirecting.
       */
      persist(res.form, res.code);

      /*
       * IMPORTANT:
       *
       * We redirect directly from GitHub Pages to the Google Form.
       *
       * The Apps Script /exec page is NEVER opened.
       */
      window.location.replace(res.url);
    }

    /*
     * ---------------------------------------------------------------
     * JSONP
     * ---------------------------------------------------------------
     *
     * We deliberately use JSONP rather than fetch().
     *
     * Google Apps Script web apps do not provide reliable CORS
     * behaviour for cross-origin fetch() requests. A script tag,
     * however, is allowed to load cross-origin JavaScript.
     */

    var callbackName =
      "verdictCallback_" +
      Math.floor(Math.random() * 1000000000);

    window[callbackName] = function (res) {
      try {
        succeed(res);
      } finally {
        /*
         * Remove the global callback after use.
         */
        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      }
    };

    /*
     * Build the Apps Script JSONP request.
     */

    var query =
      ENDPOINT +
      "?callback=" +
      encodeURIComponent(callbackName) +
      "&src=" +
      encodeURIComponent(src) +
      "&f=" +
      encodeURIComponent(storedForm) +
      "&c=" +
      encodeURIComponent(storedCode) +
      "&_=" +
      Date.now();

    /*
     * Create a script tag.
     *
     * Apps Script returns:
     *
     * verdictCallback_123456789({
     *   form: "B",
     *   code: "K7QM2XPD",
     *   url: "https://docs.google.com/forms/..."
     * });
     *
     * The callback then redirects immediately to the form.
     */

    var script = document.createElement("script");

    script.src = query;
    script.async = true;

    script.onerror = function () {
      fail("JSONP request failed");
    };

    document.head.appendChild(script);

    /*
     * If Apps Script never responds, don't leave the participant
     * staring at the loading screen forever.
     */

    timeoutId = setTimeout(function () {
      fail("No response from allocation server within " + TIMEOUT_MS + " ms");
    }, TIMEOUT_MS);
  })();
</script>
