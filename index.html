<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VERDICT Study</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #3c4043;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 440px;
      }
      h1 {
        font-size: 19px;
        font-weight: 500;
        color: #202124;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #5f6368;
        margin: 0 0 20px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 22px;
        border: 3px solid #ececec;
        border-top-color: #673ab7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a.btn {
        display: inline-block;
        background: #673ab7;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 4px;
      }
      a.btn:hover {
        background: #5e35b1;
      }
      .hidden {
        display: none;
      }
      .err {
        color: #c5221f;
      }
      #diag {
        margin-top: 18px;
        font-size: 12px;
        color: #80868b;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        background: #f8f9fa;
        border: 1px solid #e8eaed;
        border-radius: 4px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="loading">
        <div class="spinner"></div>
        <p>Preparing the questionnaire…</p>
      </div>

      <div id="manual" class="hidden">
        <h1>VERDICT Study</h1>
        <p>Estimated completion time: 10 minutes</p>
        <a id="go" class="btn" href="#">Continue to the questionnaire</a>
      </div>

      <div id="failed" class="hidden">
        <h1>The study could not be started</h1>
        <p class="err">
          Please try reloading this page. If the problem persists, contact
          <a href="mailto:suhwan.kim@tum.de">suhwan.kim@tum.de</a>.
        </p>
        <div id="diag" class="hidden"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        /* ---------------------------------------------------------------
         * CONFIG — your deployed Apps Script web-app URL.
         * Must end in /exec, with no query string.
         * ------------------------------------------------------------- */
        var ENDPOINT =
          "https://script.google.com/macros/s/AKfycbyxrsl6jS6HVkZcJpxQmZ6FTHvEGQZsqX4nSeosY_h6jZOEowBu5Qw6pE0DPDFtKtyG/exec";

        /* Must match CONFIG.STICKY_DAYS in the Apps Script.
           0 = a browser keeps its assignment indefinitely. */
        var STICKY_DAYS = 0;

        /* How long to wait for the allocation before giving up on JSONP
           and handing over to the Apps Script page instead. */
        var TIMEOUT_MS = 8000;

        var STICKY_MS = STICKY_DAYS * 24 * 60 * 60 * 1000;
        var KEY = "verdict_alloc";
        var done = false;

        function param(name) {
          var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(
            window.location.search,
          );
          return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
        }

        /* ?debug=1 shows what went wrong instead of silently falling back. */
        var DEBUG = param("debug") === "1";
        var src = param("src");

        function show(id) {
          ["loading", "manual", "failed"].forEach(function (k) {
            document.getElementById(k).className = k === id ? "" : "hidden";
          });
        }

        /* Last resort: hand the participant to the Apps Script page, which
           allocates and redirects on its own. Shows Google's grey banner and
           needs one click, but it works — better than an error screen. */
        function fallback(reason) {
          if (done) return;
          done = true;

          if (DEBUG) {
            show("failed");
            var d = document.getElementById("diag");
            d.className = "";
            d.textContent =
              "Diagnostic (?debug=1)\n\n" +
              "reason:   " + reason + "\n" +
              "origin:   " + window.location.origin + "\n" +
              "protocol: " + window.location.protocol + "\n" +
              "storage:  " + storageState + "\n" +
              "endpoint: " + ENDPOINT;
            return;
          }

          window.location.replace(
            ENDPOINT + (src ? "?src=" + encodeURIComponent(src) : ""),
          );
        }

        /* Previous assignment for this browser, if still valid. */
        var stored = { f: "", c: "" };
        var storageState = "ok";
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var o = JSON.parse(raw);
            if (
              o &&
              o.f &&
              o.c &&
              (STICKY_MS === 0 || Date.now() - o.t < STICKY_MS)
            ) {
              stored = { f: o.f, c: o.c };
            }
          }
        } catch (e) {
          storageState = "unavailable (" + e.name + ")";
        }

        var cbName = "verdictCb" + Math.floor(Math.random() * 1e9);
        window[cbName] = function (res) {
          if (done) return;

          if (!res || res.error || !res.url) {
            fallback("server replied without a usable url: " + JSON.stringify(res));
            return;
          }
          done = true;

          try {
            localStorage.setItem(
              KEY,
              JSON.stringify({ f: res.form, c: res.code, t: Date.now() }),
            );
          } catch (e) {
            /* non-fatal */
          }

          document.getElementById("go").href = res.url;

          /* An ordinary page is not sandboxed, so this needs no user gesture.
             replace() keeps this page out of back-button history, so "back"
             from the form does not trigger a second allocation. */
          window.location.replace(res.url);

          /* If navigation is blocked for any reason, offer the link. */
          setTimeout(function () {
            show("manual");
          }, 2500);
        };

        if (ENDPOINT.indexOf("PASTE_") === 0) {
          fallback("ENDPOINT not configured");
          return;
        }

        var url =
          ENDPOINT +
          "?callback=" + cbName +
          "&src=" + encodeURIComponent(src) +
          "&f=" + encodeURIComponent(stored.f) +
          "&c=" + encodeURIComponent(stored.c) +
          "&_=" + Date.now();

        var s = document.createElement("script");
        s.src = url;
        s.onerror = function () {
          fallback("script tag failed to load (blocked, offline, or CORB)");
        };
        document.head.appendChild(s);

        setTimeout(function () {
          fallback("no response within " + TIMEOUT_MS + " ms");
        }, TIMEOUT_MS);
      })();
    </script>
  </body>
</html>
